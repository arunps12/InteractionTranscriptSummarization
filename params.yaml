TrainingArguments:
  num_train_epochs: 1
  learning_rate: 5.0e-5
  warmup_steps: 500
  weight_decay: 0.01

  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 16
  fp16: true

  eval_strategy: steps          
  eval_steps: 500
  logging_steps: 10
  predict_with_generate: true
  generation_max_length: 128

  
  save_strategy: steps
  save_steps: 1000000

  
  report_to:
    - mlflow


HyperparameterTuning:
  n_trials: 15
  direction: maximize
  metric: eval_rougeL  

TrainingArgumentsBase:
  
  warmup_steps: 500

  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  fp16: true

  eval_strategy: steps
  eval_steps: 500
  logging_steps: 10

  predict_with_generate: true
  generation_max_length: 128

 
  save_strategy: "no"
  report_to:
    - mlflow

SearchSpace:
  learning_rate: [1.0e-5, 8.0e-5]          
  weight_decay: [0.0, 0.1]                
  num_train_epochs: [1, 3]                 
  gradient_accumulation_steps: [8, 16, 32] 
